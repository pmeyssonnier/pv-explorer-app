name: CI

# Contrôle qualité avant fusion : lint (ruff), tests (pytest) et validation de
# la base JSON. Se déclenche sur push et sur pull request. Aucun secret requis —
# les tests portent sur des fonctions pures (dépendances lourdes neutralisées).
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances (app + dev)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests + validation JSON (pytest)
        run: pytest
