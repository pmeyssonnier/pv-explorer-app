name: Indexer les PV dans Pinecone

# Lancement manuel uniquement (bouton "Run workflow" dans l'onglet Actions).
# Indexe la base pv_conseil_schaerbeek.json dans l'index Pinecone "pv-explorer".
#
# PRÉREQUIS : ajouter le secret PINECONE_API_KEY dans
#   Settings → Secrets and variables → Actions → New repository secret
#
# Par défaut, réindexe proprement (--reset vide l'index avant). Décoche l'option
# reset au lancement pour un simple upsert sans suppression.
on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Commune à indexer (métadonnée)"
        type: string
        default: "schaerbeek"
      input:
        description: "Fichier JSON des PV à indexer"
        type: string
        default: "pv_conseil_schaerbeek.json"
      reset:
        description: "Vider TOUT l'index avant réindexation (--reset) — toutes communes !"
        type: boolean
        default: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Indexer les PV
        working-directory: backend
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          # Via l'environnement (jamais interpolé dans le shell) pour éviter
          # toute injection depuis les inputs du workflow.
          COMMUNE: ${{ inputs.commune }}
          INPUT: ${{ inputs.input }}
          RESET: ${{ inputs.reset }}
        run: |
          RESET_FLAG=""
          if [ "$RESET" = "true" ]; then RESET_FLAG="--reset"; fi
          python index_pv.py --commune "$COMMUNE" --input "$INPUT" $RESET_FLAG
