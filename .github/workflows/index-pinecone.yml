name: Indexer les PV dans Pinecone

# Lancement manuel uniquement (bouton "Run workflow" dans l'onglet Actions).
# Indexe la base pv_conseil_schaerbeek.json dans l'index Pinecone "pv-explorer".
#
# PRÉREQUIS : ajouter le secret PINECONE_API_KEY dans
#   Settings → Secrets and variables → Actions → New repository secret
#
# Par défaut : upsert idempotent (SANS suppression). Le reset global (--reset)
# vide TOUT l'index — toutes communes — et exige une confirmation explicite
# (input reset_confirm) pour éviter tout clic accidentel destructeur.
on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Commune à indexer (métadonnée)"
        type: string
        default: "schaerbeek"
      input:
        description: "Fichier JSON des PV à indexer"
        type: string
        default: "pv_conseil_schaerbeek.json"
      reset:
        description: "⚠️ DANGER : vider TOUT l'index (toutes communes) avant réindexation"
        type: boolean
        default: false
      reset_confirm:
        description: "Pour confirmer un reset global, tape exactement : pv-explorer"
        type: string
        default: ""

# Une seule indexation à la fois : une nouvelle exécution attend la fin de la
# précédente (jamais deux écritures simultanées sur l'index). On n'annule PAS
# celle en cours — une indexation ne doit pas être coupée en plein milieu.
concurrency:
  group: pinecone-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Indexer les PV
        working-directory: backend
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          # Via l'environnement (jamais interpolé dans le shell) pour éviter
          # toute injection depuis les inputs du workflow.
          COMMUNE: ${{ inputs.commune }}
          INPUT: ${{ inputs.input }}
          RESET: ${{ inputs.reset }}
          RESET_CONFIRM: ${{ inputs.reset_confirm }}
        run: |
          RESET_FLAG=""
          if [ "$RESET" = "true" ]; then
            # Garde-fou : le reset global n'est appliqué que si la confirmation
            # correspond EXACTEMENT au nom de l'index. Sinon, échec explicite.
            if [ "$RESET_CONFIRM" != "pv-explorer" ]; then
              echo "❌ Reset global demandé mais confirmation invalide."
              echo "   Tape 'pv-explorer' dans reset_confirm pour vider TOUT l'index."
              exit 1
            fi
            echo "⚠️  RESET GLOBAL confirmé — l'index entier (toutes communes) va être vidé."
            RESET_FLAG="--reset"
          fi
          python index_pv.py --commune "$COMMUNE" --input "$INPUT" $RESET_FLAG
