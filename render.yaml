# Configuration Render — alternative à Railway
# https://render.com → New → Blueprint → pointe vers ce fichier
services:
  - type: web
    name: pv-explorer-api
    runtime: python
    plan: free                 # tier gratuit (le service s'endort après inactivité)
    branch: main               # branche déployée (auto-deploy à chaque push sur main)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    # N'auto-déploie le backend QUE si des fichiers backend (ou cette config)
    # changent. Sans ce filtre, chaque push sur main — y compris purement
    # frontend — redéployait l'API, provoquant une brève fenêtre de 502 (tier
    # gratuit). Les fichiers de données vivent dans backend/ → couverts aussi.
    # pipeline/** est inclus depuis que backend/services/pv_integration.py
    # réutilise pipeline/pv_extraction_pipeline.py à l'exécution (intégration
    # d'un PV uploadé, panneau admin) — avant, pipeline/ était un outil Colab
    # entièrement séparé du backend déployé.
    buildFilter:
      paths:
        - backend/**
        - pipeline/**
        - render.yaml
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # à saisir manuellement dans le dashboard (secret)
      - key: PINECONE_API_KEY
        sync: false
      - key: PV_JSON_PATH
        value: pv_conseil_schaerbeek.json
      - key: ALLOWED_ORIGINS
        # URLs publiques du frontend Vercel (pas un secret). Origines séparées
        # par des virgules, SANS espace. Chaque domaine depuis lequel l'app est
        # servie doit figurer ici (le navigateur envoie le domaine exact visité).
        #   pv-explorer.vercel.app     → domaine principal
        #   pv-schaerbeek.vercel.app   → alias
        value: https://pv-explorer.vercel.app,https://pv-schaerbeek.vercel.app
      # ── Authentification admin (voir backend/services/auth.py) ──
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      # ── Intégration d'un PV uploadé (voir backend/services/pv_integration.py
      # et backend/services/github_publish.py) — jeton avec la permission
      # "Contents: Read and write" sur pmeyssonnier/pv-explorer-app UNIQUEMENT
      # (fine-grained PAT recommandé, pas un token classic tous-dépôts). ──
      - key: GITHUB_TOKEN
        sync: false
