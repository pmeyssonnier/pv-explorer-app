# Configuration Render — alternative à Railway
# https://render.com → New → Blueprint → pointe vers ce fichier
services:
  - type: web
    name: pv-explorer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # à saisir manuellement dans le dashboard (secret)
      - key: PINECONE_API_KEY
        sync: false
      - key: PV_JSON_PATH
        value: pv_conseil_schaerbeek.json
      - key: ALLOWED_ORIGINS
        sync: false          # URL du frontend Vercel, à saisir dans le dashboard
